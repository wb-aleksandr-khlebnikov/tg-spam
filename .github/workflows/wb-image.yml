name: wb-image

# Publishes the image this fork's Portainer stacks run. Upstream's docker.yml needs
# PKG_TOKEN/DOCKER_HUB_TOKEN, which only exist in umputun/tg-spam, so it cannot serve
# the fork. The built-in GITHUB_TOKEN is enough to push to the fork's own ghcr namespace.
#
# Only linux/amd64 is built: the deployment host is a single x86_64 EC2 instance, and
# it is too slow to build this tree itself within the Portainer proxy timeout.

on:
  push:
    branches: [master]
  workflow_dispatch:

# :master is a moving tag, so two overlapping runs can publish out of order and leave it
# pointing at the older build. Keep one run per ref and drop the superseded one.
concurrency:
  group: wb-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push to ghcr.io
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            CI=github
            GITHUB_SHA=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          tags: |
            ghcr.io/wb-aleksandr-khlebnikov/tg-spam:master
            ghcr.io/wb-aleksandr-khlebnikov/tg-spam:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
