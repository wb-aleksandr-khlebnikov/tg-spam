services:
  tg-spam-wb:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: never
    container_name: tg-spam-wb
    restart: unless-stopped
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      TELEGRAM_GROUP: ${TELEGRAM_GROUP}
      ADMIN_GROUP: ${ADMIN_GROUP}
      TZ: ${TZ:-Europe/Moscow}

      DISABLE_ADMIN_SPAM_FORWARD: ${DISABLE_ADMIN_SPAM_FORWARD:-false}
      DRY: ${DRY:-false}
      SOFT_BAN: ${SOFT_BAN:-false}
      NO_SPAM_REPLY: ${NO_SPAM_REPLY:-true}
      MAX_EMOJI: ${MAX_EMOJI:-2}
      MIN_MSG_LEN: ${MIN_MSG_LEN:-40}
      MIN_PROBABILITY: ${MIN_PROBABILITY:-42}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.65}
      FIRST_MESSAGES_COUNT: ${FIRST_MESSAGES_COUNT:-5}

      META_LINKS_LIMIT: ${META_LINKS_LIMIT:-0}
      META_MENTIONS_LIMIT: ${META_MENTIONS_LIMIT:-3}
      META_IMAGE_ONLY: ${META_IMAGE_ONLY:-true}
      META_LINKS_ONLY: ${META_LINKS_ONLY:-true}
      META_FORWARD: ${META_FORWARD:-true}
      META_KEYBOARD: ${META_KEYBOARD:-true}
      META_CONTACT_ONLY: ${META_CONTACT_ONLY:-true}
      META_GIVEAWAY: ${META_GIVEAWAY:-true}

      OPENAI_CHECK_SHORT_MESSAGES: ${OPENAI_CHECK_SHORT_MESSAGES:-true}
      AGGRESSIVE_CLEANUP: ${AGGRESSIVE_CLEANUP:-true}
      AGGRESSIVE_CLEANUP_LIMIT: ${AGGRESSIVE_CLEANUP_LIMIT:-200}
      HISTORY_DURATION: ${HISTORY_DURATION:-72h}
      HISTORY_MIN_SIZE: ${HISTORY_MIN_SIZE:-5000}
      SUPPRESS_JOIN_MESSAGE: ${SUPPRESS_JOIN_MESSAGE:-true}
      DELETE_JOIN_MESSAGES: ${DELETE_JOIN_MESSAGES:-true}
      DELETE_LEAVE_MESSAGES: ${DELETE_LEAVE_MESSAGES:-true}

      MESSAGE_SPAM: ${MESSAGE_SPAM:-Кажется, тут был спам. Если вы человек, напишите админам и попробуйте снова.}
      MESSAGE_DRY: ${MESSAGE_DRY:-this is spam (dry mode)}
      MESSAGE_RESTORE: ${MESSAGE_RESTORE:-Прошу прощения, принял вас за спамера. Вот ваше сообщение:}

      OPENAI_TOKEN: ${OPENAI_TOKEN}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_VETO: ${OPENAI_VETO:-false}

      LOGGER_ENABLED: ${LOGGER_ENABLED:-true}
      LOGGER_FILE: ${LOGGER_FILE:-/srv/log/tg-spam.log}
      LOGGER_MAX_SIZE: ${LOGGER_MAX_SIZE:-5M}
      SERVER_ENABLED: ${SERVER_ENABLED:-true}
      SERVER_LISTEN: ${SERVER_LISTEN:-:8081}
      TGSPAM_IN_DOCKER: "1"
    command: ${TGSPAM_COMMAND:---super=evgeny_boger}
    volumes:
      - tg-spam-wb_data:/srv/data
      - tg-spam-wb_log:/srv/log
    ports:
      - "8081:8081"

volumes:
  tg-spam-wb_data:
  tg-spam-wb_log:
